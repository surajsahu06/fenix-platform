services:
  db:
    image: mysql:8.0
    container_name: fenix-mysql
    environment:
      MYSQL_DATABASE: logistics_platform
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: fenix-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/logistics_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SECURITY_USER_NAME: fenix
      SPRING_SECURITY_USER_PASSWORD: fenix123
    restart: unless-stopped
  tests:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: fenix-platform-test
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/logistics_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SECURITY_USER_NAME: fenix
      SPRING_SECURITY_USER_PASSWORD: fenix123
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_URL: jdbc:mysql://db:3306/logistics_platform
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: password
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    command: ["mvn", "-q", "clean", "test"]
